name: dis_app
description: "App zur Unterstützung von Menschen mit Dissoziativer Identitätsstörung"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.19+19

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Direkt statt transitiv, weil `@useResult` im eigenen Code steht.
  meta: ^1.15.0
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State Management & Streams
  rxdart: ^0.28.0

  # Storage (Hive CE - Community Edition)
  hive_ce: ^2.8.0
  hive_ce_flutter: ^2.3.2
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Cryptography (für Passwort-Hashing)
  crypto: ^3.0.3
  bcrypt: ^1.1.3  # Secure password hashing with salt

  # Dependency Injection
  get_it: ^9.2.1

  # Image Picker
  image_picker: ^1.1.3

  # Eigene Kameraansicht statt der System-Kamera-App
  camera: ^0.11.0

  # Time Picker Spinner (iOS-Style Wheel Picker)
  flutter_time_picker_spinner: ^2.0.0

  # URL Launcher (für Telefonnummern)
  url_launcher: ^6.3.1

  # UUID Generator
  uuid: ^4.5.1

  # Intl (Datumsformatierung)
  intl: ^0.20.1

  # Package Info (für Debug-Reports)
  package_info_plus: ^9.0.1

  # Calendar UI
  table_calendar: ^3.1.2

  # Audio Recording & Playback
  record: ^7.1.1
  just_audio: ^0.9.40

  # Video Player
  video_player: ^2.9.2

  # Permissions
  permission_handler: ^11.3.1

  # Local Notifications
  flutter_local_notifications: ^17.0.0

  # QR Code Generator
  qr_flutter: ^4.1.0

  # Firebase
  firebase_core: ^4.13.0
  cloud_firestore: ^6.0.0
  firebase_app_check: ^0.4.6

  # Maps & Location (v3.1 - Finder Feature)
  flutter_map: ^8.0.0
  flutter_map_tile_caching: ^10.0.0  # Persistent tile cache with offline support (v10 for flutter_map 8.x)
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  http: ^1.2.2

  # Social Sharing (v3.1 - Puzzle Sharing Feature)
  share_plus: ^12.0.2

  # Animations (UI Improvements)
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0

  # Zeitzonen für geplante Benachrichtigungen. notification_service.dart
  # importiert das Paket direkt; bisher kam es nur transitiv über
  # flutter_local_notifications herein und wäre bei dessen nächstem Update
  # ohne Vorwarnung verschwunden.
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Quality & Linting
  # very_good_analysis provides 200+ strict lint rules for Flutter apps
  # Replaces flutter_lints with more comprehensive checks
  very_good_analysis: ^10.3.0

  # Custom Lint Rules für DIS App Architektur-Standards
  dis_app_lints:
    path: dis_app_lints
  custom_lint: ^0.8.1

  # Hive CE Code Generation
  hive_ce_generator: ^1.6.0
  build_runner: ^2.4.13

  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Enable code generation for localization
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/logo.png
    - assets/images/logo_icon.png
    - assets/images/logo_text.png
    - assets/images/logo_icon_transparent.png
    - assets/images/logo_text_transparent.png
    - assets/images/logo_rainbow.png
    # Chamäleon-Begleiter, ein Bild je Bereich
    - assets/images/cham_halt.png
    - assets/images/cham_notfall.png
    - assets/images/cham_hilfe.png
    - assets/images/cham_chat.png
    - assets/images/cham_kalender.png
    - assets/images/cham_medikamente.png
    - assets/images/cham_tagebuch.png
    - assets/images/cham_kontakte.png
    - assets/images/cham_finder.png
    - assets/images/cham_spiele.png
    - assets/images/cham_zeitachse.png
    - assets/images/cham_feedback.png
    # Tier-Avatar-Vorlagen
    - assets/images/Girafe.png
    - assets/images/Hund.png
    - assets/images/Katze.webp
    # Color Picker
    - assets/images/Color-wheel-light-color-spectrum.webp
    # Permission Presets (JSON Config)
    - assets/config/permission_presets.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_icon_transparent.png"
  adaptive_icon_background: "#28272C"
  adaptive_icon_foreground: "assets/images/logo_icon_transparent.png"
  remove_alpha_ios: true
